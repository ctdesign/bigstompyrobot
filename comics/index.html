---
layout: default
title: Comics
permalink: /comics/
---

<div class="grid-column-row">
  <div class="grid-column-full">
    <h2 class="title">Our comic releases</h2>
    
    <ul class="content-list">
      {% for post in site.comics reversed %}
        <li class="content-list__item">
          <a href="{{ post.url }}" class="">
            <h3 class="comic-list__title">{{post.title }}</h3>
            <img src="{{post.thumb}}" width="300" height="300" />
            <p>{{ post.blurb }}</p>
          </a> 
        </li>
      {% endfor %}
    </ul>
    
    <p>More titles coming soon...</p>
</div>
</div>
