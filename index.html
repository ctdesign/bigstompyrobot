---
layout: default
---

<div class="grid-row">
  <div class="ad-banner">
    <a href="{{ '/comics/rednight' | relative_url }}"><img src="{{ '/assets/images/red-night-banner.jpg' | relative_url }}" alt="Red Night Part One Out Now"></a>
  </div>
</div> 


<div class="grid-row">
  <div class="grid-column-two-thirds">
    <h3>Latest blog</h3>

    <ul class="content-list">
      {% for post in site.posts limit:3 %}
      <li class="content-list__item">
        <h4><a href="{{ post.url }}">{{ post.title }}</a></h4>
        <p>{{ post.excerpt }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
  <div class="grid-column-one-third">
    {% include newsletter.html %}
  </div>
</div>
