---
layout: default 
---
<div class="grid-row">
    <div class="grid-column-two-thirds">
        <h1>{{page.title}}</h1>
        {{content}}
    </div>
    <div class="grid-column-one-third">
        <dl>
            <dt>Title:</dt>
            <dd>{{ page.title }}</dd>
            <dt>Released on:</dt>
            <dd>{{ page.date | date: "%B %d, %Y" }}</dd>
       
        </dl>
         

    </div>
</div>
