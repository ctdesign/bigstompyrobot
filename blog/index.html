---
layout: default
title: Blog
permalink: /blog/
---

<h2>Blog index page</h2>

<ul class="content-list">
    {% for post in site.posts %}
        <li class="content-list__item">
            <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
            <p>{{ post.excerpt }}</p>
        </li>
    {% endfor %}
</ul>
