---
layout: default
title: Blog
permalink: /blog/
---
<div class="grid-container clearfix">
<div class="grid-row">
    <div class="grid-column-full">
        <h2 class="title">The Big Stompy Blog</h2>
    </div>
</div>
<div class="grid-row">
    <div class="grid-column-two-thirds">
        <ul class="content-list">
            {% for post in site.posts %}
            <li class="content-list__item">
                <p class="content-list__meta">{{ post.date | date: "%B %d, %Y" }}</p>
                <h3 class="content-list__title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
                <p>{{ post.excerpt }}</p>
                <a class="content-list__more" href="{{ post.url }}">Read more &#8594;</a>
            </li>
            {% endfor %}
        </ul>
    </div>
    <div class="grid-column-one-third">
        {% include newsletter.html %}
    </div>
</div>
</div>
